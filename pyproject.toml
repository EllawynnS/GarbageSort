[project]
name = "garbagesort"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "JaisungSinghLidder", email = "jaisung.lidder@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.162.2",
    "huggingface-hub>=2.4.0",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pillow>=13.0.0",
    "pyside6>=6.12.0",
    "requests>=2.34.2",
    "safetensors>=0.8.0",
    "torch>=2.15.0",
    "transformers>=5.22.2",
]

[project.scripts]
garbagesort = "garbagesort:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
